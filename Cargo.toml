[workspace]
members = [
    "crates/agency-agents",
    "crates/agency-desktop",
    "crates/agency-mcp",
    "crates/agency-mux",
    "crates/agency-rpc",
    "crates/agency-translator-api",
    "crates/agency-translators",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
iced = { version = "0.14.0", features = ["tokio", "wgpu", "svg", "markdown", "image", "highlighter"] }
libghostty-vt = "0.2.1"
portable-pty = "0.9.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
