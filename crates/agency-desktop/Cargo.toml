[package]
name = "agency-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "agency"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.6.1", features = ["image-data", "wayland-data-control"] }
agency-agents = { path = "../agency-agents" }
agency-mcp = { path = "../agency-mcp" }
agency-mux = { path = "../agency-mux" }
agency-rpc = { path = "../agency-rpc" }
agency-translator-api = { path = "../agency-translator-api" }
agency-translators = { path = "../agency-translators" }
base64 = "0.22"
iced.workspace = true
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
libghostty-vt.workspace = true
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt"] }
toml = "0.9"
